# /etc/nginx/sites-available/aeroassist.online
# Serves the Alburaq static site at www.AeroAssist.online
#
# Install:
#   sudo cp deploy/nginx-aeroassist.conf /etc/nginx/sites-available/aeroassist.online
#   sudo ln -s /etc/nginx/sites-available/aeroassist.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS with a free Let's Encrypt certificate:
#   sudo certbot --nginx -d aeroassist.online -d www.aeroassist.online

server {
    listen 80;
    listen [::]:80;
    server_name aeroassist.online www.aeroassist.online;

    root /var/www/aeroassist;
    index index.html;

    # Single static page — serve it for any path (client-side hash router handles the rest)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for the immutable assets; the HTML itself stays fresh
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
